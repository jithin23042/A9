<text x="36" y="42" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Electronics product validation — Part 2</text>
<text x="36" y="68" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Verified against ElectronicsProductValidator and its product-mapper and ProductOptionFacadeImpl call sites.</text>
<g><rect x="25" y="105" width="295" height="135" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><path d="M 34 105 H 311 Q 320 105 320 114 V 145 H 25 V 114 Q 25 105 34 105" fill="#e2e8f0"/><text x="39" y="131" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Product create / update</text><text x="39" y="166" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">PersistableProductMapper</text><text x="39" y="191" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Calls validator for the Electronics branch</text></g><g><rect x="350" y="105" width="300" height="135" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><path d="M 359 105 H 641 Q 650 105 650 114 V 145 H 350 V 114 Q 350 105 359 105" fill="#e2e8f0"/><text x="364" y="131" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Product-definition mapping</text><text x="364" y="166" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">PersistableProductDefinitionMapper</text><text x="364" y="191" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Calls ElectronicsProductValidator</text></g><g><rect x="680" y="105" width="300" height="135" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><path d="M 689 105 H 971 Q 980 105 980 114 V 145 H 680 V 114 Q 680 105 689 105" fill="#e2e8f0"/><text x="694" y="131" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Product attribute update</text><text x="694" y="166" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">ProductOptionFacadeImpl</text><text x="694" y="191" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Validates the merged attribute set</text></g><g><rect x="1040" y="105" width="365" height="135" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><path d="M 1049 105 H 1396 Q 1405 105 1405 114 V 145 H 1040 V 114 Q 1040 105 1049 105" fill="#cbd5e1"/><text x="1054" y="131" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Category initialization</text><text x="1054" y="166" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">InitializationDatabaseImpl</text><text x="1054" y="191" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Creates category code: electronics</text></g><path d="M 170 240 L 475 285" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 500 240 L 610 285" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 830 240 L 745 285" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="410" y="285" width="510" height="70" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="665" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">ElectronicsProductValidator.validate(product)</text><text x="665" y="337" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#334155">isElectronics() scopes the rule to category code electronics</text><path d="M 665 355 L 665 390" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><polygon points="665,390 825,440 665,490 505,440" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="665" y="436" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Category is</text><text x="665" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">electronics?</text><path d="M 505 440 L 300 440" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="402.5" y="433" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">No</text><g><rect x="35" y="395" width="265" height="105" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><path d="M 44 395 H 291 Q 300 395 300 404 V 435 H 35 V 404 Q 35 395 44 395" fill="#cbd5e1"/><text x="49" y="421" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Non-Electronics</text><text x="49" y="456" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Validator returns</text><text x="49" y="480" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Existing path continues</text></g><path d="M 665 490 L 665 520" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="665" y="498" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">Yes</text><polygon points="665,520 850,575 665,630 480,575" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="665" y="570" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Manufacturer code nonblank</text><text x="665" y="589" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">and not DEFAULT?</text><path d="M 665 630 L 665 670" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="665" y="643" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">Yes</text><polygon points="665,670 850,725 665,780 480,725" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="665" y="720" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Exactly one attribute with</text><text x="665" y="739" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">option code warranty_period?</text><path d="M 665 780 L 665 820" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="665" y="793" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">Yes</text><polygon points="665,820 865,875 665,930 465,875" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="665" y="870" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">At least one option-value description</text><text x="665" y="889" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a">is an integer month count from 1–120?</text><path d="M 665 930 L 665 965" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="665" y="940.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">Yes</text><g><rect x="470" y="965" width="390" height="100" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><path d="M 479 965 H 851 Q 860 965 860 974 V 1005 H 470 V 974 Q 470 965 479 965" fill="#bbf7d0"/><text x="484" y="991" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Valid Electronics product</text><text x="484" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Continue through the existing save path</text></g><path d="M 850 575 L 1080 575" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="965" y="568" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">No</text><path d="M 850 725 L 1080 725" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="965" y="718" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">No</text><path d="M 865 875 L 1080 875" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="972.5" y="868" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">No</text><g><rect x="1080" y="520" width="315" height="300" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><path d="M 1089 520 H 1386 Q 1395 520 1395 529 V 560 H 1080 V 529 Q 1080 520 1089 520" fill="#fecdd3"/><text x="1094" y="546" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Validation failure</text><text x="1094" y="581" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">ConversionRuntimeException</text><text x="1094" y="609" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Required brand missing / DEFAULT</text><text x="1094" y="637" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Warranty attribute missing or duplicated</text><text x="1094" y="665" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">No value with a whole-month count 1–120</text></g><text x="25" y="1095" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569">Source: ElectronicsProductValidator.java; PersistableProductMapper.java; PersistableProductDefinitionMapper.java; ProductOptionFacadeImpl.java; InitializationDatabaseImpl.java. The initialization method shown creates the category code; it is not a separate validation rule.</text></svg>