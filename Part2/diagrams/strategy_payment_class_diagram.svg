odules&quot;)</text><text x="54" y="217" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e293b">Map&lt;String, PaymentModule&gt; paymentModules</text><text x="54" y="238" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e293b">getPaymentModule(code)</text><text x="54" y="259" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e293b">returns paymentModules.get(code)</text></g><g><rect x="40" y="405" width="335" height="235" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><path d="M 49 405 H 366 Q 375 405 375 414 V 445 H 40 V 414 Q 40 405 49 405" fill="#cbd5e1"/><text x="54" y="431" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">paymentModules</text><text x="54" y="466" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Spring XML util:map (configuration)</text><text x="54" y="490" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">beanstream → beanstream</text><text x="54" y="514" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">paypal-express-checkout → paypal-ec</text><text x="54" y="538" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">moneyorder → moneyorder</text><text x="54" y="562" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">stripe / stripe3 / braintree</text><text x="54" y="586" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">razorpay → bean razorpay</text></g><g><rect x="475" y="250" width="300" height="240" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/><path d="M 484 250 H 766 Q 775 250 775 259 V 290 H 475 V 259 Q 475 250 484 250" fill="#bfdbfe"/><text x="489" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">PaymentModule</text><text x="489" y="311" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">«interface»</text><text x="489" y="334" font-family=