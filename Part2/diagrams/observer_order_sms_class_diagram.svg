<title id="title">Shopizer Order-status Observer — SMS notification</title><desc id="desc">Verified against OrderFacadeImpl, OrderStatusChangedEvent, OrderStatusSmsListener, SmsProvider and UnconfiguredSmsProvider in Part2/code.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
 <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" stroke="#475569" stroke-width="1.5" fill="#f8fafc"/></marker>
</defs>
<rect width="1450" height="900" fill="#f8fafc"/>
<text x="36" y="42" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Shopizer Order-status Observer — SMS notification</text>
<text x="36" y="68" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Verified against OrderFacadeImpl, OrderStatusChangedEvent, OrderStatusSmsListener, SmsProvider and UnconfiguredSmsProvider in Part2/code.</text>
<path d="M 200 350 L 200 435" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="385.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">writes status history</text><path d="M 360 210 L 425 210" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="392.5" y="203" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">publishes</text><path d="M 360 290 L 800 290" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="580" y="283" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">creates event after status/history write</text><path d="M 560 275 L 560 350" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="305.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">Spring dispatch</text><path d="M 560 460 L 560 505" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="475.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">implements</text><path d="M 800 630 L 900 630" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="850" y="623" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">delegates sendSms(...)</text><path d="M 1100 665 L 1100 710" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#openArrow)"/><text x="1100" y="680.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">implements</text><path d="M 1120 300 L 1195 390" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1157.5" y="338" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334155" stroke="#f8fafc" stroke-width="4" paint-order="stroke">carries Order</text><g><rect x="35" y="125" width="325" height="225" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><path d="M 44 125 H 351 Q 360 125 360 134 V 165 H 35 V 134 Q 35 125 44 125" fill="#e2e8f0"/><text x="49" y="151" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">OrderFacadeImpl</text><text x="49" y="186" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">updateOrderStatus(order, newStatus, store)</text><text x="49" y="213" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Returns immediately when status is unchanged</text><text x="49" y="240" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Sets new status and writes OrderStatusHistory</text><text x="49" y="267" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Publishes only for SHIPPED / DELIVERED</text></g><g><rect x="35" y="435" width="325" height="135" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><path d="M 44 435 H 351 Q 360 435 360 444 V 475 H 35 V 444 Q 35 435 44 435" fill="#cbd5e1"/><text x="49" y="461" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">OrderService</text><text x="49" y="496" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">addOrderStatusHistory(order, history)</text><text x="49" y="521" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Called before event publication in method body</text></g><g><rect x="425" y="135" width="275" height="140" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/><path d="M 434 135 H 691 Q 700 135 700 144 V 175 H 425 V 144 Q 425 135 434 135" fill="#bfdbfe"/><text x="439" y="161" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">ApplicationEventPublisher</text><text x="439" y="196" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Spring interface</text><text x="439" y="221" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">publishEvent(event)</text></g><g><rect x="800" y="120" width="350" height="250" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/><path d="M 809 120 H 1141 Q 1150 120 1150 129 V 160 H 800 V 129 Q 800 120 809 120" fill="#bfdbfe"/><text x="814" y="146" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">OrderStatusChangedEvent</text><text x="814" y="181" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">extends ApplicationEvent</text><text x="814" y="206" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Order order</text><text x="814" y="231" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">OrderStatus oldStatus / newStatus</text><text x="814" y="256" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">String transitionId</text><text x="814" y="281" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Uses history ID when available</text></g><g><rect x="1195" y="390" width="220" height="155" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><path d="M 1204 390 H 1406 Q 1415 390 1415 399 V 430 H 1195 V 399 Q 1195 390 1204 390" fill="#e2e8f0"/><text x="1209" y="416" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Order (payload)</text><text x="1209" y="451" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Used for order ID</text><text x="1209" y="476" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Delivery telephone</text><text x="1209" y="501" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Billing telephone fallback</text></g><g><rect x="425" y="350" width="275" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><path d="M 434 350 H 691 Q 700 350 700 359 V 390 H 425 V 359 Q 425 350 434 350" fill="#cbd5e1"/><text x="439" y="376" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">ApplicationListener</text><text x="439" y="411" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Spring interface</text><text x="439" y="434" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">onApplicationEvent(event)</text></g><g><rect x="425" y="505" width="375" height="265" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/><path d="M 434 505 H 791 Q 800 505 800 514 V 545 H 425 V 514 Q 425 505 434 505" fill="#fed7aa"/><text x="439" y="531" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">OrderStatusSmsListener</text><text x="439" y="566" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Implements ApplicationListener&lt;Event&gt;</text><text x="439" y="594" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">@Async event handler</text><text x="439" y="622" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Filters SHIPPED / DELIVERED</text><text x="439" y="650" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Uses delivery phone, then billing phone</text><text x="439" y="678" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Deduplicates recent transition IDs</text><text x="439" y="706" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Logs provider failures without propagating</text></g><g><rect x="900" y="555" width="260" height="110" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/><path d="M 909 555 H 1151 Q 1160 555 1160 564 V 595 H 900 V 564 Q 900 555 909 555" fill="#bfdbfe"/><text x="914" y="581" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">SmsProvider</text><text x="914" y="616" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">«interface»</text><text x="914" y="641" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">sendSms(phoneNumber, message)</text></g><g><rect x="900" y="710" width="260" height="105" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><path d="M 909 710 H 1151 Q 1160 710 1160 719 V 750 H 900 V 719 Q 900 710 909 710" fill="#e2e8f0"/><text x="914" y="736" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0f172a">UnconfiguredSmsProvider</text><text x="914" y="771" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Default @Component</text><text x="914" y="795" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e293b">Throws IllegalStateException</text></g><text x="35" y="855" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569">Important: the source shows publication after the status-history call in the method body; this diagram does not assert after-commit transaction timing. The default provider does not deliver real SMS.</text></svg>